name: HEDNA
kind: company
description: >-
  HEDNA (Hotel Electronic Distribution Network Association) is a not-for-profit
  trade association founded in 1991 and headquartered in Forest Hill, Maryland,
  United States, that convenes the hotel distribution industry — hotel chains,
  GDS operators, OTAs, switches, channel managers, payment providers and
  connectivity vendors — around shared best practice for hospitality electronic
  distribution. It sits alongside rather than inside the distribution chain: it
  moves no inventory and processes no bookings, but its Disciplines
  (Connectivity, Content Distribution, Payments, Data & Analytics, Revenue
  Optimization) produce recommendation documents, and it co-authored the Open
  Payments Alliance Standards Specification with HTNG and OpenTravel. HEDNA
  publishes no developer portal, no API, and no machine-readable specification
  on hedna.org; every probe of developer./developers./docs./api. subdomains and
  of /developers, /api, /docs, /openapi.json, /swagger.json, /api-docs and
  /.well-known/ failed (DNS failure or HTTP 404). Its publications library,
  research reports and HEDNA U courseware are gated behind paid membership at
  members.hedna.org (HTTP 403 Cloudflare challenge unauthenticated) and
  pathlms.com/hedna. Honest posture: member-gated documents, no public API, no
  exit path published.
