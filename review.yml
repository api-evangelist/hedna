aid: hedna
name: HEDNA
review:
  question: Does HEDNA publish a public developer portal, an API, or freely
    downloadable machine-readable specifications?
  answer: false
  date: '2026-07-28'
  reviewer: API Evangelist
  tier: industry-body-standards
  homeMarket: United States
findings:
  summary: |
    HEDNA (Hotel Electronic Distribution Network Association) is a not-for-profit
    trade association founded in 1991, headquartered at 2331 Rock Spring Road,
    Forest Hill, Maryland, United States. It is a convening body for hotel
    electronic distribution, not an operator of distribution infrastructure: it
    holds no inventory, brokers no bookings, and issues no industry identifiers.

    No developer portal, no API, and no machine-readable specification is
    published on hedna.org. Every developer-oriented subdomain probed failed to
    resolve, and every well-known specification path returned HTTP 404. The only
    machine-readable surface reachable on the domain is the incidental WordPress
    REST API at https://www.hedna.org/wp-json/ (HTTP 200, 15 namespaces, 249
    routes) — an artifact of the site's CMS, not an offering HEDNA documents,
    supports, or presents as a product. It is deliberately NOT listed in
    apis.yml apis[].

    HEDNA's technical output is prose and schema documents produced by its
    Disciplines and by joint work with other bodies — most notably the Open
    Payments Alliance Standards Specification (Phase I 2020, Phase II) authored
    with HTNG and OpenTravel, plus Standards Committee documents such as
    Management of Digital Assets, GDS Dual Representation Exception Process, and
    360 Degrees Virtual Tour and Video Recommendations. None of these were found
    freely downloadable from hedna.org during this review; the publications
    library sits behind paid membership at members.hedna.org.

    HTNG, HEDNA's closest peer body and co-author of the Open Payments Alliance
    work, no longer resolves as an independent site (https://www.htng.org/
    connection failure), which materially thins the set of alternative bodies
    covering the same ground.
  organization:
    legalForm: not-for-profit trade association
    founded: 1991
    headquarters: 2331 Rock Spring Road, Forest Hill, Maryland, United States
