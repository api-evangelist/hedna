actions:
  apisListed: 0
  openapiHarvested: false
  specsCount: 0
  openapiDirectoryCreated: false
  reason: |
    No OpenAPI, AsyncAPI, GraphQL schema, or other machine-readable contract was
    found anywhere on hedna.org or its subdomains. Nothing was fabricated and no
    openapi/ directory was created. The WordPress REST API root at
    https://www.hedna.org/wp-json/ was confirmed live and parseable but is an
    incidental CMS surface rather than a published HEDNA API, so it was recorded
    here as evidence and excluded from apis.yml apis[].
  status: built-stub
