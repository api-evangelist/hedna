certificationProgram:
  exists: false
  note: No certification directory, certified-vendor registry, or conformance
    level scheme was found. The Connectivity Discipline is described as
    establishing "best practices for live rate requests and vendor certification
    standards," but no published certification programme, registry, or list of
    certified parties is publicly available.
switchingCost:
  interfaceShape: none-published
  interfaceShapeEvidence: |
    No API contract of any kind is published by HEDNA. No OpenAPI, AsyncAPI,
    GraphQL schema, JSON Schema, WSDL, or XSD was located on hedna.org. The
    standards HEDNA co-authors (Open Payments Alliance, with HTNG and
    OpenTravel) are genuine multi-party open standards in intent, but the
    artifacts themselves were not found publicly downloadable from HEDNA, so
    HEDNA publishes no interface a customer could integrate against or migrate
    off. The only machine-readable surface on the domain is the incidental
    WordPress REST API (https://www.hedna.org/wp-json/, HTTP 200), which is a
    generic third-party CMS interface, not a HEDNA contract.
  secondSource: alternatives-with-migration
  secondSourceAlternativesConsidered: |
    OpenTravel Alliance (publishes the OTA XML/JSON message schemas — overlaps
    on payments standards work but is a schema body, not a convener);
    HTNG / Hospitality Technology Next Generation (closest peer and Open
    Payments Alliance co-author, but https://www.htng.org/ no longer resolves —
    connection failure on probe, so no longer an independent second source);
    AHLA (US hotel industry advocacy, broader than distribution);
    HSMAI (commercial strategy and revenue; HEDNA has an announced collaboration
    with HSMAI per its own feed);
    Phocuswright and EyeForTravel (travel distribution research, commercial not
    member-governed).
    Conclusion: adjacent bodies cover parts of HEDNA's remit, but none is a
    drop-in replacement for distribution-specific convening plus the member
    library. There is, however, zero technical migration — a departing member
    loses access to documents and the network, not a running integration.
  exitPath: no-export-published
  exitPathEvidence: |
    No export, dump, bulk, reporting, or data-portability operation is published,
    because no API is published. The privacy policy
    (https://www.hedna.org/privacy-user-consent/) states that "Certain tools and
    settings are provided to help you access, correct, delete, or modify your
    personal information" and invites contact to "request an update,
    modification, or deletion of your information, to opt-out of certain
    services, or to withdraw any consent." It does NOT commit to data
    portability, machine-readable export, or a GDPR/CCPA request procedure.
    Member data is held in a third-party database: "The personal information we
    collect from you is stored in a database hosted by a third party,
    YourMembership ("YM")." A departing member's practical exit is loss of access
    to the members-only publications library and HEDNA U courseware; no
    provision for retaining or exporting downloaded materials is published.
  identifierPortability: |
    HEDNA issues no industry identifiers of its own. It operates no chain-code,
    property-code, or agency-number registry. Its guidance sits over identifiers
    minted by others — GDS chain and property codes (referenced by the GDS Dual
    Representation Exception Process document), and the switch/connectivity
    identifiers used between PMS, CRS, GDS and OTA systems. The only identifier
    HEDNA controls is an opaque member account record in the YourMembership AMS
    at members.hedna.org, which is vendor-internal and non-portable.
  contractualLockIn: |
    Published annual dues by category (https://www.hedna.org/membership/):
    Hospitality Professionals $1,950; Technology Partners $1,950; Hospitality
    Independent Chain (fewer than 50 properties) $950; Industry Experts $500,
    which "requires Board approval and written service agreement"; Hospitality
    Single Property (1-3 properties) $250; Educators $250, requires Board
    approval; Student $50, requires valid student ID and Board approval.
    No minimum term beyond the annual period, no exclusivity clause, no
    auto-renewal terms, no termination-notice requirement, and no full-content
    or volume commitment are published anywhere on hedna.org. Membership terms
    and conditions were not found as a public document. Nothing further is
    verifiable and nothing is inferred.
  accessGate: none-published
  accessGateDetail: |
    There is nothing for a developer to sign up for: no portal, no key issuance,
    no application form, no sandbox. For CONTENT rather than API access, the gate
    is paid annual membership (see contractualLockIn), with three of the seven
    categories additionally requiring Board approval and, for Industry Experts, a
    written service agreement. HEDNA U is delivered through a separate gated LMS
    at https://www.pathlms.com/hedna. No IATA/ARC accreditation is required —
    this is a dues-and-approval gate, not a licensed-intermediary gate.
  distributionModel: not-applicable
  distributionModelDetail: |
    HEDNA is a trade association about distribution, not a participant in it. It
    holds no inventory, operates no switch, and intermediates no bookings. Its
    members include every layer of the chain — hotel chains, GDS operators, OTAs,
    switches, channel managers and payment providers — but HEDNA itself sits
    outside the chain.
  ndcPosture: |
    Not applicable. NDC is an IATA air-distribution standard; HEDNA's remit is
    hotel electronic distribution. No NDC certification, level claim, endpoint or
    registry entry exists or would be expected. No NDC reference was found on
    hedna.org during this review.
